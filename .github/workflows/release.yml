# Manual source verification only. Approved release assets are uploaded separately.
name: Release source verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build and run offline checks (no release publication)
        run: .\src\tools\verify-ci.ps1
      - name: Upload verification logs only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source-verification
          path: |
            src/.work/logs/ci/
            src/.work/offline_e2e_receipt.json
          if-no-files-found: warn
          retention-days: 7
